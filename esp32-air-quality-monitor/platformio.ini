; NOTE: this project is normally built with Arduino IDE. This file is
; only kept for reference — it may lag behind the sketch.
[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_cpu = 160000000L

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.1
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit AHTX0@^2.0.5
    adafruit/Adafruit BusIO@^1.14.1
    sciosense/ScioSense_ENS160

; ──────────────────────────────────────────────
; If your board isn't esp32-c3-devkitm-1, set the
; board + the TFT_*/I2C_* pins in the sketch.
;   board = seeed_xiao_esp32c3   # Seeed XIAO C3 (TFT: SCLK=8 MOSI=6 CS=10 DC=7 RST=9 BL=3)
; ──────────────────────────────────────────────
