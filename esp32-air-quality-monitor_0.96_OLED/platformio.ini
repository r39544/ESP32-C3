[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dio
board_build.f_cpu = 160000000L

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
    adafruit/Adafruit AHTX0@^2.0.5
    adafruit/Adafruit ENS160@^1.0.1
    adafruit/Adafruit BusIO@^1.14.1
    ; ESPAsyncWebServer + AsyncTCP for ESP32-C3
    ottojo/AsyncTCP@^2.0.0
    esphome/ESPAsyncWebServer@^3.1.0

; ──────────────────────────────────────────────
; If your board isn't esp32-c3-devkitm-1,
; swap in one of these:
;
;   board = seeed_xiao_esp32c3       # Seeed XIAO (SDA=4, SCL=5)
;   board = airm2m_c3_4mb            # AirM2M C3  (SDA=6, SCL=7)
;   board = esp32-c3-devkitm-1        # Espressif   (SDA=8, SCL=9)
;   board = lolin_c3_mini             # Lolin C3 mini (SDA=8, SCL=9)
;
; Then set I2C_SDA / I2C_SCL in src/main.cpp
; to match your board's I²C pins.
; ──────────────────────────────────────────────
